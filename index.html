<script>
(function(){
"use strict";
const VERSION = "v1.2";
const FIELD = true; // true i kNm Timer (mobilapp uten Claude)
document.getElementById("ver").textContent = VERSION;

/* ============ Defaults (satser) ============ */
const DEF = {
  profile:{ name:"", empNo:"", company:"kNm Hydraulikk AS" },
  pay:{ monthly:0, divisor:162.5, hourly:0, threshold:8, pctLow:50, pctHigh:100, coveredWeekday:7.5, coveredOffshore:0, coveredWeekend:0, includeBase:true, travelRate:0, socialPct:30, dbTarget:30, travelBeforeH:4, offLimit:168, hotbed:0, pctHellig:100, pctHelligOT:100, nightAdd:0, travelFreeFrom:"08:00", travelFreeTo:"16:00", untimedPaid:false },
  state:{ year:2026, dietNight:1012, diet6to12:397, dietOver12:736, nightUnrec:452, mealB:20, mealL:30, mealD:50, partialDayHours:6,
          km:5.30, kmPass:1.00, kmTrailer:1.00, kmForest:1.00,
          tfKm:3.50, tfKmPass:1.00, tfHotel:693, tf6to12:200, tfOver12:400, tfPension:400, tfPrivate:107, tfNight:452 },
  aml:{ dayNormal:9, weekNormal:40, lim7:10, lim4w:25, limYear:200, maxDay:13, max7:48, includeTravel:false },
  extraHolidays:[],
  hires:[],
  contracts:[]
};
const CONTRACT_TEMPLATE = { name:"Ny kontrakt", customer:"", po:"", active:true, status:"aktiv", ordThreshold:12, rOrd:0, rOT:0, helgTillegg:0, helligTillegg:0, rHellig:0, rHelligOT:0, rNight:0, weekendOT:true, sundayAsHoliday:false, dayRate:0, rReise:0, rStandby:0, mobFee:0, markup:10, kmRate:0, mobMode:"", rMob:0, startDate:"", endDate:"", dietBill:"auto", dietRate:0, kmBill:"auto", hotbedRate:0, hotbedDefault:false, note:"" };

/* ============ Utils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf2 = new Intl.NumberFormat("nb-NO",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf1 = new Intl.NumberFormat("nb-NO",{minimumFractionDigits:0,maximumFractionDigits:2});
const kr = v => nf2.format(v||0);
const nf0 = new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0});
const kr0 = v => nf0.format(Math.round(v||0));
const hr = v => nf1.format(Math.round((v||0)*100)/100);
const num = v => { const n = parseFloat(String(v??"").replace(",", ".")); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o));
function deepMerge(base, over){
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object"){
    const out = {...base};
    if (over && typeof over === "object") for (const k of Object.keys(over)) out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
    return out;
  }
  return over === undefined ? base : over;
}
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
/* Dates as UTC-noon to avoid DST issues */
const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const ds = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return ds(d); };
const todayStr = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const DOW = ["Søn","Man","Tir","Ons","Tor","Fre","Lør"];
const MON = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const fmtDate = s => { const d = D(s); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()}.${d.getUTCMonth()+1}.`; };
const fmtDateY = s => { const d = D(s); return `${d.getUTCDate()}.${d.getUTCMonth()+1}.${d.getUTCFullYear()}`; };
function isoWeek(s){ const d = D(s); const day = (d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3); const y = d.getUTCFullYear(); const f = new Date(Date.UTC(y,0,4,12)); const w = 1+Math.round(((d-f)/864e5 - 3 + ((f.getUTCDay()+6)%7))/7); return {y, w, key:`${y}-W${String(w).padStart(2,"0")}`}; }
const mondayOf = s => { const d = D(s); return addDays(s, -((d.getUTCDay()+6)%7)); };
/* Klokkeslett i halvtimer: 00:00, 00:30 … 23:30 (eldre verdier som 07:15 beholdes som eget valg) */
const HALF = Array.from({length:48}, (_,i) => `${String(Math.floor(i/2)).padStart(2,"0")}:${i % 2 ? "30" : "00"}`);
const tsel = (attrs, v) => { v = v || ""; const opts = HALF.slice(); if (v && !opts.includes(v)) opts.push(v), opts.sort();
  return `<select ${attrs}><option value=""${v ? "" : " selected"}>--:--</option>${opts.map(o => `<option value="${o}"${o === v ? " selected" : ""}>${o}</option>`).join("")}</select>`; };
const toMin = t => { const [h,m] = String(t).split(":").map(Number); return (h||0)*60+(m||0); };

/* ============ Helligdager ============ */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return `${y}-${String(mo).padStart(2,"0")}-${String(da).padStart(2,"0")}`; }
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const e = easter(y), m = {};
  m[`${y}-01-01`]="1. nyttårsdag"; m[addDays(e,-3)]="Skjærtorsdag"; m[addDays(e,-2)]="Langfredag"; m[e]="1. påskedag"; m[addDays(e,1)]="2. påskedag";
  m[`${y}-05-01`]="Arbeidernes dag"; m[`${y}-05-17`]="Grunnlovsdag"; m[addDays(e,39)]="Kristi himmelfartsdag"; m[addDays(e,49)]="1. pinsedag"; m[addDays(e,50)]="2. pinsedag";
  m[`${y}-12-25`]="1. juledag"; m[`${y}-12-26`]="2. juledag";
  return holCache[y] = m;
}
function holidayName(s){ const x = (S.settings.extraHolidays||[]).find(h => h.date === s); return x ? x.name : holidays(+s.slice(0,4))[s] || null; }
function dayKind(s, contract){
  if (holidayName(s)) return "hellig";
  const w = D(s).getUTCDay();
  if (w === 0) return (contract && contract.sundayAsHoliday) ? "hellig" : "helg";
  if (w === 6) return "helg";
  return "hverdag";
}

/* ============ State & storage ============ */
const WHO_KEY = "knm_who", PROJ_KEY = "knm_proj";
const S = { who:"", uid:null, db:null, assets:null, downloads:null, sample:null, mode:"init", settings:clone(DEF), entries:{}, trips:{}, approvals:{}, tab:"", month:todayStr().slice(0,7), report:null, day:todayStr(), week:mondayOf(todayStr()), tripView:null, per:{kind:"week", month:todayStr().slice(0,7), contractId:"", from:todayStr(), to:addDays(todayStr(),13), hideEmpty:null} };
let queue = [];
let refs = null;
const cacheKey = () => `knm_tb_cache_${S.uid||"local"}`;
const queueKey = () => `knm_tb_queue_${S.uid||"local"}`;
function saveCache(){ ls.set(cacheKey(), {settings:S.settings, entries:S.entries, trips:S.trips, approvals:S.approvals}); }
function loadCache(){ const c = ls.get(cacheKey()); if (c){ S.settings = deepMerge(clone(DEF), c.settings||{}); S.entries = c.entries||{}; S.trips = c.trips||{}; S.approvals = c.approvals||{}; } queue = ls.get(queueKey()) || []; }
function setSync(state, text){ const el = $("#sync"); el.title = text + " · " + VERSION; el.innerHTML = `<i class="dot ${state}"></i><span>${esc(text)}</span>`; }
function updateSyncBadge(){
  if (FIELD){ const ch = FL.lastChange > FL.lastSent; return setSync(ch ? "wait" : "ok", ch ? "Ikke sendt" : "Alt sendt"); }
  if (S.mode === "local") return setSync("wait","Kun denne enheten");
  if (queue.length) return setSync("wait", navigator.onLine ? `Sender ${queue.length} …` : `${queue.length} venter på nett`);
  setSync("ok","Synkronisert");
}
function persist(kind, id, data){
  tourReset();
  if (kind === "entries" && data && data.hotbed === undefined && data.dayType === "offshore"){ const hc = contractById(data.contractId); data.hotbed = !!(hc && hc.hotbedDefault); }
  if (kind === "entries" || kind === "trips"){
    const lk = x => x && (kind === "entries" ? isLocked(x.date, x.contractId) : tripLocked(x));
    if (lk(S[kind][id]) || lk(data)){ toast("Perioden er signert og låst. Lås opp under Signerte timelister for å endre."); render(); return false; }
    const cs = x => x && x.contractId && contractById(x.contractId) ? statusOf(contractById(x.contractId)) : "aktiv";
    if ((S[kind][id] && cs(S[kind][id]) !== "aktiv") || (data && cs(data) !== "aktiv")){ const st = cs(data || S[kind][id]) !== "aktiv" ? cs(data || S[kind][id]) : cs(S[kind][id]); toast(`Kontrakten har status «${STATUS[st]}». Endre status under Anbud for å føre eller endre.`); render(); return false; }
  }
  if (kind === "settings") S.settings = data;
  else if (data === null) delete S[kind][id]; else S[kind][id] = data;
  if (FIELD && kind !== "settings") fieldTomb(kind, data === null ? id : undefined);
  saveCache();
  if (S.mode === "db"){
    queue = queue.filter(q => !(q.kind === kind && q.id === id));
    queue.push({kind, id, data});
    ls.set(queueKey(), queue);
    flush();
  }
  render();
}
let flushing = false;
const dropQ = q => { const i = queue.indexOf(q); if (i >= 0) queue.splice(i, 1); ls.set(queueKey(), queue); };
async function flush(){
  if (flushing || S.mode !== "db" || !refs) return;
  flushing = true; updateSyncBadge();
  try{
    while (queue.length){
      const q = queue[0];
      const ref = q.kind === "settings" ? refs.app : refs[q.kind].doc(q.id);
      try{
        if (q.data === null) await ref.delete(); else await ref.set(q.data);
        // Fjern akkurat denne endringen. En nyere endring på samme føring (lagt i køen mens denne ble skrevet) skal stå igjen og skrives etterpå.
        dropQ(q);
      }catch(e){
        const code = e && e.code;
        if (code === "invalid_argument" || code === "transform_error" || code === "quota_exceeded"){
          dropQ(q);
          toast(code === "quota_exceeded" ? "Databasen er full. Eksporter en backup og slett gamle føringer." : "En endring kunne ikke lagres og ble forkastet.");
        } else { break; }
      }
    }
  } finally { flushing = false; updateSyncBadge(); }
}
setInterval(flush, 20000);
window.addEventListener("online", flush);
const pendingIds = kind => new Set(queue.filter(q => q.kind === kind).map(q => q.id));

async function boot(){
  if (FIELD) return fieldBoot();
  loadCache(); render();
  const C = window.claude;
  let db = null, user = null;
  try{ if (C && C.use){ [db, user] = await Promise.all([C.use("db"), C.use("user")]); } }catch(e){}
  if (C && C.use){
    C.use("assets").then(a => { S.assets = a; }).catch(()=>{});
    C.use("downloads").then(a => { S.downloads = a; render(); }).catch(()=>{});
    C.use("sample").then(a => { S.sample = a; if (a && a.limits) a.limits().then(l => { S.sampleImg = l && l.images ? l.images : null; }).catch(() => {}); }).catch(()=>{});
  }
  let id = null;
  try{ id = user ? await user.id() : null; }catch(e){}
  if (!db || !id){
    S.mode = "local"; S.uid = null; loadCache(); updateSyncBadge(); render();
    return;
  }
  S.db = db; S.uid = id; S.mode = "db"; loadCache();
  const base = `data/users/${id}/app`;
  refs = { app: db.doc(base), entries: db.doc(base).collection("entries"), trips: db.doc(base).collection("trips"), approvals: db.doc(base).collection("approvals") };
  refs.app.onSnapshot(snap => {
    if (pendingIds("settings").size) return;
    if (snap.exists){ S.settings = deepMerge(clone(DEF), clone(snap.data())); saveCache(); render(); logoFixOnce(); payFix75Once(); }
    else if (!snap.metadata.fromCache){
      const s = clone(DEF);
      s.contracts = [Object.assign({id:uid()}, CONTRACT_TEMPLATE, {name:"Mal – offshore timepris (rediger)", ordThreshold:12})];
      persist("settings", "app", s);
    }
  }, err => { setSync("bad","Mistet kontakt – laster på nytt ved neste åpning"); });
  const sub = (kind, ref) => ref.onSnapshot(qs => {
    const pend = pendingIds(kind), next = {};
    qs.docs.forEach(d => { next[d.id] = clone(d.data()); });
    for (const q of queue) if (q.kind === kind){ if (q.data === null) delete next[q.id]; else next[q.id] = q.data; }
    S[kind] = next; saveCache(); render();
  }, err => setSync("bad","Mistet kontakt med databasen"));
  sub("entries", refs.entries); sub("trips", refs.trips); sub("approvals", refs.approvals);
  updateSyncBadge(); flush();
}

/* ============ Beregninger ============ */
const rateSummary = c => { const p = [`${kr0(c.rOrd)} / ${kr0(c.rOT)} kr/t`]; if (mobModeOf(c) === "fixed") p.push(`mob./demob. ${kr0(c.mobFee)} per vei`); else if (num(c.rReise)) p.push(`reise ${kr0(c.rReise)} kr/t`); if ((c.planType || "offshore") === "offshore" && num(c.hotbedRate)) p.push(`hotbed ${kr0(c.hotbedRate)}`); return p.join(" · "); };
const ordPo = c => c ? [c.orderNo || "", c.po || ""].filter(Boolean).join(" / ") || "–" : "–";
// Etikett etter hva som faktisk er fylt ut – så et ordrenummer aldri kan leses som kundens PO
const ordPoLabel = c => c && c.orderNo && c.po ? "Ordre nr / PO" : c && c.po ? "PO" : "Ordre nr";
const ordPoText = c => c ? [c.orderNo ? "Ordre nr " + c.orderNo : "", c.po ? "PO " + c.po : ""].filter(Boolean).join(" · ") : "";
const mobFeeHint = v => num(v) > 0 ? `Én tur ut og hjem = mob. ${kr(num(v))} + demob. ${kr(num(v))} = <b>${kr(2 * num(v))} kr</b> per person` : "Beløpet gjelder én vei. En tur ut og hjem faktureres 2 ganger.";
const rReiseHint = (v, fx) => num(v) ? (fx ? "Brukes i Reisekost personell (CRM), ikke til kunde ved fastpris." : "Til kunde. Brukes også i Reisekost personell (CRM).") : "0: Reisekost personell blir 0. Sett timepris for reise.";
const priceModeOf = c => c ? (c.priceMode || (num(c.dayRate) > 0 ? "dag" : "time")) : "time";
const mobModeOf = c => c ? (c.mobMode || (num(c.mobFee) > 0 ? "fixed" : "actual")) : "actual";
const contractById = id => (S.settings.contracts||[]).find(c => c.id === id) || null;
function lineHours(l){
  if (l.start && l.end){ let d = toMin(l.end) - toMin(l.start); if (d <= 0) d += 1440; d -= num(l.pause); return Math.max(0, d/60); }
  return Math.max(0, num(l.hours));
}
function entryTotals(e){
  const t = {arbeid:0, reise:0, standby:0, mob:0};
  (e.lines||[]).forEach(l => { t[l.type] = (t[l.type]||0) + lineHours(l); });
  return t;
}
const entryHours = e => { const t = entryTotals(e); return t.arbeid + t.reise + t.standby + t.mob; };
/* Personer: "" = meg (ansatt), ellers id til innleid. "*" = alle (bare i rapport/eksport). */
const whoOf = x => (x && x.who) || "";
// Utlegg til kunde: etter regning = huket av som standard; fastpris mob./demob. = bare når «faktureres i tillegg til fastpris» er huket av
// Bom og ferje føres som utlegg. Eldre reiser med bom/ferje på kjørestrekningen flyttes til utleggslinjer når reisen åpnes eller synkes.
function legsToExp(tr){ tr.legs = tr.legs || []; tr.expenses = tr.expenses || [];
  tr.legs.forEach(l => { if (!l.lid) l.lid = uid(); const rt = [l.from, l.to].filter(Boolean).join("–");
    [["bom", num(l.toll)], ["ferje", num(l.ferry)]].forEach(([t, a]) => { if (!(a > 0)) return;
      const est = l.gen && !l.conf && (!l.genSrc || num(l.genSrc[t === "bom" ? "toll" : "ferry"]) === a);
      tr.expenses.push(Object.assign({date: l.date || (tr.start || "").slice(0, 10), type: t, text: rt, amount: a, paidBy: l.paidBy === "firma" ? "firma" : "meg", rebill: l.rebill !== false, lid: l.lid}, l.gen ? {gen: t + "-" + l.gen, genSrc: a} : {}, l.gen && !est ? {conf: true} : {})); });
    delete l.toll; delete l.ferry; if (l.genSrc){ delete l.genSrc.toll; delete l.genSrc.ferry; } });
  return tr; }
const expLabel = x => { const a = [EXP_TYPE[x.type] || "", (x.vendor || "").trim(), (x.text || "").trim()].filter(Boolean); return a.filter((v, i) => a.findIndex(w => w.toLowerCase() === v.toLowerCase()) === i).join(" – ") || "Utlegg"; };
const expBilled = (x, t) => { const c = t && contractById(t.contractId); return c && mobModeOf(c) === "fixed" ? !!x.fxBill : x.rebill !== false; };
const bfLabel = (toll, ferry) => num(toll) > 0 && num(ferry) > 0 ? "Bom og ferje" : num(ferry) > 0 ? "Ferje" : "Bom";
// Estimat fra anbud: linjer laget fra mannskapskortet som verken er endret eller bekreftet
const legEst = l => !!(l && l.gen && !l.conf && (!l.genSrc || num(l.km) === num(l.genSrc.km)));
const expEst = e => !!(e && e.gen && !e.conf && num(e.amount) === num(e.genSrc));
/* Ansatte: "" = hovedansatt (profilen), ellers id i S.settings.staff. Innleide: id i S.settings.hires. */
const staffById = id => id ? (S.settings.staff || []).find(x => x.id === id) : null;
const isHire = w => !!w && (S.settings.hires || []).some(h => h.id === w);
const personName = w => !w ? (S.settings.profile.name || "Meg") : (staffById(w) || {}).name || ((S.settings.hires || []).find(h => h.id === w) || {}).name || "Ukjent";
const empIds = () => [""].concat((S.settings.staff || []).map(x => x.id));

function periodSum(from, to, contractId, who){

  const TM0 = () => ({diet:0,night:0,dietTaxable:0,kmAmt:0,kmTax:0,km:0,refund:0,toEmployee:0});

    Object.entries(byC).forEach(([ck, es]) => {

      r.items.forEach(it => { const k = w + "|" + it.code + "|" + it.rate; const x = acc.items[k] = acc.items[k] || {label:pre(w) + it.label, unit:it.unit, rate:it.rate, qty:0, amount:0, who:w}; x.qty += it.qty; x.amount += it.amount; });

    const byW = {}; arr.forEach(e => (byW[whoOf(e)] = byW[whoOf(e)] || []).push(e));

  });

      acc.items[k] = {label:`${pre(w)}${x.text} ${x.date ? fmtDate(x.date) : ""} (kost ${kr(x.base)}${m.markup ? ` + ${hr(m.markup*100)} % påslag` : ""})`, unit:"stk", rate:amt, qty:1, amount:amt, who:w}; acc.total += amt; tsum += amt; });
    if (m.custDiet > 0){ const k = "diett|" + t.id; acc.items[k] = {label:`${pre(w)}Diett ${t.title||""} (statens satser)`, unit:"døgn", rate:m.custDiet/m.custDietDays, qty:m.custDietDays, amount:m.custDiet, who:w}; acc.total += m.custDiet; tsum += m.custDiet; }

// Felt på samme rad i et skjema: etikettene får lik høyde, så alle inndatafelt står på linje
function alignGrids(){
  document.querySelectorAll(".fgrid").forEach(g => {
    if (g.offsetParent === null) return;
    const items = [...g.children].filter(c => c.offsetParent !== null).map(c => { const lab = c.matches("label.field") ? c : c.querySelector("label.field"); const sp = lab && lab.firstElementChild && lab.firstElementChild.tagName === "SPAN" ? lab.firstElementChild : null; return sp ? {c, sp} : null; }).filter(Boolean);
    items.forEach(x => { x.sp.style.minHeight = ""; x.sp.classList.remove("alg"); });
    const rows = {}; items.forEach(x => { const k = Math.round(x.c.getBoundingClientRect().top); (rows[k] = rows[k] || []).push(x); });
    Object.values(rows).forEach(arr => { if (arr.length < 2) return; const m = Math.max(...arr.map(x => x.sp.getBoundingClientRect().height)); arr.forEach(x => { if (x.sp.getBoundingClientRect().height < m - 0.5){ x.sp.style.minHeight = m + "px"; x.sp.classList.add("alg"); } }); });
  });
}

let lastMode = null;
const TAB_KEY = "knm_tb_tab_";
function applyMode(){
  const m = currentMode();

  else { S.who = ls.get(WHO_KEY) || ""; if (S.who && !personIds().includes(S.who)) S.who = ""; } // samme personvalg på Mac og mobil
  document.body.classList.toggle("mob", m === "mobile");

  document.body.classList.toggle("desk", m === "desktop");

  if (m !== lastMode){

const tripsArr = (who) => Object.entries(S.trips).map(([id,t]) => Object.assign({id}, t)).filter(t => inWho(t, who === undefined ? (S.who || "") : who));
const byStart = (a,b) => (a.start||"") < (b.start||"") ? -1 : 1;
function activeTrip(d){ return tripsArr().filter(t => t.start && t.end && t.start.slice(0,10) <= d && t.end.slice(0,10) >= d).sort(byStart)[0] || null; }
function nextTrip(d){ return tripsArr().filter(t => t.start && t.start.slice(0,10) > d).sort(byStart)[0] || null; }
const daysBetween = (a,b) => Math.round((D(b) - D(a))/864e5);

function lastUsed(){ return Object.values(S.entries).filter(e => whoOf(e) === (S.who || "")).sort((a,b) => (a.updated||0) < (b.updated||0) ? 1 : -1)[0] || null; }

const TYPE_LABEL = {arbeid:"Arbeid", reise:"Reise/mob.", standby:"Standby", mob:"Reise/mob."};
/* Type dag: Offshore / Onshore (intern verdi "felt"). «Kontor» vises bare for eldre føringer som har det. */
const typeOpts = v => `<option value="offshore"${v==="offshore"?" selected":""}>Offshore</option><option value="felt"${v==="felt"?" selected":""}>Onshore</option>${v==="kontor" ? `<option value="kontor" selected>Kontor (gammel)</option>` : ""}`;
/* Gjeldende kontrakt for en dato: aktiv kontrakt der datoen ligger i prosjektperioden (inkl. reisedag før).
   Har flere treff, foretrekkes den der personen står i mannskapet. Ellers nærmeste aktive prosjekt, så sist brukte. */
function contractFor(d, who){
  if (who === undefined) who = S.who || "";
  const act = (S.settings.contracts || []).filter(c => statusOf(c) === "aktiv");
  const inCrew = c => (c.planCrewRows || []).some(r => (r.hireId || "") === who);
  const cover = act.filter(c => c.startDate && projStart(c) <= d && (!projEnd(c) || projEnd(c) >= d));
  if (cover.length) return cover.find(inCrew) || cover[0];
  const dated = act.filter(c => c.startDate).sort((a,b) => Math.abs(daysBetween(d, a.startDate)) - Math.abs(daysBetween(d, b.startDate)));
  const lu = lastUsed(), luc = lu && act.find(c => c.id === lu.contractId);
  return dated.find(inCrew) || dated[0] || luc || act[0] || null;
}
const typeOfContract = c => c && c.planType ? (c.planType === "felt" ? "felt" : "offshore") : "";
function defaultsFor(d){
  const es = entriesOn(d), lu = lastUsed(), tr = activeTrip(d);
  let pc = typeof perContract === "function" && perContract() ? contractById(perContract()) : null;
  if (pc && currentMode() === "mobile" && statusOf(pc) !== "aktiv") pc = null; // mobil: bare aktive prosjekter
  const c = pc || (tr && contractById(tr.contractId)) || contractFor(d);
  return { contractId: es[0] ? es[0].contractId : (c && c.id) || (lu && lu.contractId) || ((S.settings.contracts||[])[0]||{}).id || "",
           dayType: es[0] ? es[0].dayType : (typeOfContract(c) || (lu && lu.dayType !== "kontor" && lu.dayType) || (tr ? "offshore" : "felt")),
           ref: es[0] ? es[0].ref || "" : (lu && lu.ref) || "", location: es[0] ? es[0].location || "" : (lu && lu.location) || "",
           hotbed: es[0] ? !!es[0].hotbed : !!(c && c.hotbedDefault) };
}
function tripStrip(d){
  const tr = activeTrip(d);
  if (tr){
    const n = daysBetween(tr.start.slice(0,10), d) + 1, tot = daysBetween(tr.start.slice(0,10), tr.end.slice(0,10)) + 1;
    return `<div class="strip"><span>${esc(tr.title || tr.destination || "Reise")}</span><b>Dag ${n}/${tot}</b></div>` +
      (tot <= 31 ? `<div class="dots" aria-hidden="true">${Array.from({length:tot}, (_,i) => `<i class="${i < n-1 ? "d" : i === n-1 ? "n" : ""}"></i>`).join("")}</div>` : "");
  }
  const nx = nextTrip(d);
  return nx ? `<div class="strip dim"><span>Neste: ${esc(nx.title || nx.destination || "reise")}</span><b>${fmtDate(nx.start.slice(0,10))}</b></div>` : "";
}

function inlineView(e){
  const L = e.lines || [], ar = L.filter(l => l.type === "arbeid"), re = L.filter(l => l.type === "reise"), sb = L.filter(l => l.type === "standby"), mb = L.filter(l => l.type === "mob");
  const simple = ar.length <= 1 && (re.length + mb.length) <= 1 && sb.length <= 1 && !(ar[0] && !(ar[0].start || ar[0].end) && num(ar[0].hours) > 0);
  const hv = l => l ? String(Math.round(lineHours(l)*100)/100) : "";
  return {simple, start: ar[0] ? ar[0].start || "" : "", end: ar[0] ? ar[0].end || "" : "", pause: ar[0] && num(ar[0].pause) ? num(ar[0].pause) : "", reise: re[0] && lineHours(re[0]) ? hv(re[0]) : "", mob: mb[0] && lineHours(mb[0]) ? hv(mb[0]) : "", rm: (re[0] || mb[0]) && lineHours(re[0] || mb[0]) ? hv(re[0] || mb[0]) : "", rstart: (re[0] || mb[0] || {}).start || "", rend: (re[0] || mb[0] || {}).end || "", standby: sb[0] && lineHours(sb[0]) ? hv(sb[0]) : ""};
}
function applyRow(e, row){
  e.contractId = row.contractId; e.dayType = row.dayType; if ("ref" in row) e.ref = (row.ref || "").trim();
  if ("hotbed" in row) e.hotbed = !!row.hotbed && row.dayType === "offshore";
  if ("night" in row) e.night = !!row.night;
  e.lines = e.lines || [];
  if (!inlineView(e).simple) return;
  let a = e.lines.find(l => l.type === "arbeid");
  if (row.start || row.end){ if (!a){ a = {type:"arbeid"}; e.lines.unshift(a); } a.start = row.start; a.end = row.end; if (row.pause !== undefined) a.pause = num(row.pause); else if (a.pause === undefined) a.pause = 0; delete a.hours; }
  else if (a) e.lines = e.lines.filter(l => l !== a);
  { /* Reise/mob. i én kolonne: offshoredag = mob./demob., ellers reise */
    const tp = row.dayType === "offshore" ? "mob" : "reise"; let l = e.lines.find(x => x.type === "mob" || x.type === "reise");
    if ("rstart" in row){ // Reise med klokkeslett fra–til
      if (row.rstart || row.rend){ if (!l){ l = {type:tp}; e.lines.push(l); } l.type = tp; l.start = row.rstart; l.end = row.rend; l.pause = 0; delete l.hours; }
      else if (l && (l.start || l.end)) e.lines = e.lines.filter(x => x !== l);
      else if (l) l.type = tp; // gammel føring med bare timer beholdes
    } else { const v = num(row.rm);
    if (v > 0){ if (!l){ l = {type:tp}; e.lines.push(l); } l.type = tp; if (!(l.start && l.end && Math.abs(lineHours(l) - v) < 0.01)){ l.start = ""; l.end = ""; l.pause = 0; l.hours = v; } }
    else if (l) e.lines = e.lines.filter(x => x !== l); }
  }
  for (const t of ["standby"]){
    const v = num(row[t]); let l = e.lines.find(x => x.type === t);
    if (v > 0){ if (!l){ l = {type:t}; e.lines.push(l); } if (!(l.start && l.end && Math.abs(lineHours(l) - v) < 0.01)){ l.start = ""; l.end = ""; l.pause = 0; l.hours = v; } }
    else if (l) e.lines = e.lines.filter(x => x !== l);
  }
}

function planActual(c){
  const p = planCalc(c), aF = projStart(c) || p.from, aT = projEnd(c) && projEnd(c) > p.to ? projEnd(c) : p.to, ps = periodSum(aF, aT, c.id, "*");
  const cust = Object.values(ps.cust).reduce((s,a) => s + a.total, 0), b = c.bid && !bidEditing(c) ? c.bid : null;
  // Reisekost for alle personer på prosjektet (ansatte og innleide): diett, overnatting u/kvittering, km og refusjon
  const T = x => x.diet + x.night + x.kmAmt + x.refund, H = Object.values(ps.hires), E = Object.values(ps.emps);
  const travel = H.reduce((a, h) => a + T(h.tm), 0) + E.reduce((a, e) => a + T(e.tm), 0);
  // Faktisk kost: innleide = avregningen (timer etter deres satser + reisekost). Ansatte = tillegg og reisetid + reisekost + fastlønnsandel som i anbudet + sosiale kostnader.
  const sosP = num(S.settings.pay.socialPct) / 100, fast = p.cost.fast, empPay = E.reduce((a, e) => a + e.pay.total, 0);

  const cost = H.reduce((a, h) => a + h.invoice, 0) + empPay + E.reduce((a, e) => a + e.tm.toEmployee, 0) + fast + (empPay + fast) * sosP + firmPaid;
  const costPlan = b ? b.cost : p.costTotal, custPlan = b ? b.cust : p.custTotal;
  return {p, cust, cost, custPlan, costPlan, rows:[["Arbeidstimer", b ? b.work : p.hours.work, ps.hours.arbeid + ps.hours.standby], ["Mob./reisetimer", b ? b.mob : p.hours.mob, ps.hours.reise], ["Fakturagrunnlag kr", custPlan, cust, 1], ["Kost kr", costPlan, cost, 1], ["Reisekost personell kr", b ? b.travel : p.cost.diet + p.cost.km + p.cost.exp, travel, 1]]};
}

/* ============ Sheets (editors) ============ */
function openSheet(html){
  document.documentElement.classList.add("sheet-open");
  const old = $("#sheetHost .sheet"), y = old ? old.scrollTop : 0, ae = document.activeElement, fid = old && ae && old.contains(ae) ? ae.id : null;
  $("#sheetHost").innerHTML = `<div class="sheet-bg" data-a="closeBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh = $("#sheetHost .sheet");
  if (old){ sh.scrollTop = y; if (fid){ const f = document.getElementById(fid); if (f) f.focus({preventScroll:true}); } }
  else { const f = $("#sheetHost input, #sheetHost select"); if (f && window.innerWidth > 760) f.focus(); }
  // Utgangspunkt for «ulagrede endringer»: leses fra skjemaet første gang arket åpnes
  if (editing && editing !== sheetBaseFor){ sheetBaseFor = editing; sheetBase = null;
    if (SAVE_A[editing.kind] && editing.obj){ try{ FORM_READ[editing.kind](); }catch(e){} sheetBase = JSON.stringify(editing.obj); } }
}
let sheetBase = null, sheetBaseFor = null;
const SAVE_A = {trip:"saveTrip", contract:"saveContract", hire:"saveHire", staff:"saveStaff", entry:"saveEntry", main:"saveMain"};
const FORM_READ = {trip: () => readTripForm(), contract: () => readContractForm(), hire: () => readHireForm(), staff: () => readStaffForm(), entry: () => readEntryForm(), main: () => readMainForm()};
// Lukk: spør om lagring hvis noe er endret
function tryClose(){
  const k = editing && editing.kind, sa = k && SAVE_A[k];
  if (sa && sheetBase !== null && $(`#sheetHost [data-a="${sa}"]`)){
    try{ FORM_READ[k](); }catch(e){}
    if (JSON.stringify(editing.obj) !== sheetBase){
      if (pendingSheet){ const fn = pendingSheet; pendingSheet = null; fn(); } // tegn ferdig først, så banneret ikke forsvinner
      const sh = $("#sheetHost .sheet"); if (!sh) return closeSheet(); const old = sh.querySelector(".unsaved"); if (old) old.remove();
      sh.insertAdjacentHTML("afterbegin", `<div class="unsaved" role="alertdialog"><b>Du har endringer som ikke er lagret.</b><div class="row" style="gap:8px"><button class="btn pri sm" data-a="${sa}">Lagre</button><button class="btn sm danger" data-a="discardSheet">Forkast endringer</button><button class="btn sm" data-a="keepSheet">Fortsett å redigere</button></div></div>`);
      sh.scrollTop = 0; return;
    }
  }
  closeSheet();
}

  const tr = ex ? clone(ex) : { who: FIELD ? "" : currentMode() === "mobile" ? (S.who || "") : null, title: pc && pc.startDate ? pc.name : "", contractId: (pc && pc.id) || ((S.settings.contracts||[])[0]||{}).id || "", destination:"", start:`${s0}T06:00`, end:`${e0}T18:00`, overnight:true, days:[], legs:[], expenses:[], plan:"" };
  tr.days = tr.days || []; tr.legs = tr.legs || []; tr.expenses = tr.expenses || []; legsToExp(tr);
  if (!ex && tr.who === null){ const w1 = soleCrew(contractById(tr.contractId)); if (w1 !== null) tr.who = w1; }

  editing = {kind:"trip", id: id || null, obj: tr, confirmDel:false};
  drawTrip();

// Kjente strekninger: lagres når en reise lagres (fra, til, km, bom, ferje). Km gjelder begge veier; bom/ferje bare samme retning.
const rtKey = (a, b) => (String(a || "").trim().toLowerCase().replace(/\s+/g, " ")) + "→" + (String(b || "").trim().toLowerCase().replace(/\s+/g, " "));
function routeLookup(from, to){ const R = S.settings.routes || {}; if (!String(from || "").trim() || !String(to || "").trim()) return null;
  const f = R[rtKey(from, to)]; if (f) return {km: f.km, toll: f.toll, ferry: f.ferry, exact: true};
  const r = R[rtKey(to, from)]; return r ? {km: r.km, exact: false} : null; }
function routeLearn(tr){ const R = Object.assign({}, S.settings.routes || {}); let ch = false;
  (tr.legs || []).forEach(l => { if (!String(l.from || "").trim() || !String(l.to || "").trim() || !(num(l.km) > 0)) return; const sx = t => (tr.expenses || []).filter(e => l.lid && e.lid === l.lid && e.type === t).reduce((a, e) => a + num(e.amount), 0) + num(l[t === "bom" ? "toll" : "ferry"]);
    const k = rtKey(l.from, l.to), v = {from: String(l.from).trim(), to: String(l.to).trim(), km: num(l.km), toll: sx("bom"), ferry: sx("ferje"), at: todayStr()};

async function importJson(file){

    if (!j || !["kNm Prosjekt","kNm Timebank"].includes(j.app)){ toast("Filen er ikke en kNm Prosjekt-backup"); return; }
    persist("settings","app", deepMerge(clone(DEF), j.settings||{}));
    let n = 0;
    for (const [id,e] of Object.entries(j.entries||{})){ if (!S.entries[id]){ persist("entries", id, e); n++; } }
    for (const [id,t] of Object.entries(j.trips||{})){ if (!S.trips[id]){ persist("trips", id, t); n++; } }

    else { const y = clone(t); delete y.fLink; y.expenses = (y.expenses || []).map(x => { const z = clone(x); delete z.receiptUrl; if (z.receipt && ((z.date || t.start || "").slice(0,10) >= cut)) need.add(z.receipt); return z; }); out.trips[id] = y; } });
  if (fixed) saveCache();
  return {out, need};
}
async function fieldSend(){
  const L = FL.link; if (!L){ toast("Åpne den personlige lenken fra kNm først"); return; }
  const {out, need} = fieldExport();
  for (const k of need){ try { const b = await idb.get(k); if (b) out.rc[k] = await blobDataUrl(b); } catch(e){} }
  const name = `kNm_Timer_${(L.n || "person").split(" ")[0]}_${todayStr()}.json`, file = new File([JSON.stringify(out)], name, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Timer til kNm"}); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    ls.set("knm_timer_sent", Date.now()); updateSyncBadge(); toast("Sendt – takk!"); render();
  } catch(e){ if (!(e && e.name === "AbortError")) toast("Kunne ikke dele filen"); }
}
const fieldDue = () => FIELD && FL.link && FL.lastChange > FL.lastSent && (new Date().getDay() === 5 || Date.now() - FL.lastSent > 7 * 864e5);
function vSend(){
  const L = FL.link, ch = FL.lastChange > FL.lastSent, nE = Object.keys(S.entries).length, nX = Object.values(S.trips).reduce((a, t) => a + (t.expenses || []).filter(x => !x.lnk).length, 0);
  return `<h2>Send til kNm</h2>
  ${L ? `<section class="card" style="display:grid;gap:10px">
    <div><b>${esc(L.n)}</b><div class="small muted">Prosjekter oppdatert ${esc(fmtDateY(L.at))} · ${(L.cs || []).length} ${(L.cs || []).length === 1 ? "prosjekt" : "prosjekter"}</div></div>
    <p class="small" style="margin:0">${nE} føringer · ${nX} utlegg i appen. ${FL.lastSent ? `Sist sendt ${esc(fmtDateY(new Date(FL.lastSent).toISOString().slice(0,10)))}.` : "Ikke sendt ennå."} ${ch ? `<b style="color:var(--bad)">Endringer som ikke er sendt.</b>` : "Alt er sendt."}</p>
    <button class="btn pri big" data-a="fSend">Send til kNm</button>
    <p class="small muted" style="margin:0">Velg e-post, SMS eller AirDrop. Alt sendes hver gang – det blir ikke dobbelt hos kNm.</p></section>` : `<div class="empty">Appen er ikke koblet til en person. Åpne den personlige lenken du har fått fra kNm.</div>`}
  <section class="card" style="display:grid;gap:8px"><span class="label">Ny lenke fra kNm</span>
    <p class="small muted" style="margin:0">Når kNm sender ny lenke (nye prosjekter), lim den inn her. Timene dine beholdes.</p>
    <textarea id="fNewLink" rows="2" placeholder="Lim inn lenke …"></textarea><button class="btn" data-a="fLinkApply">Oppdater prosjekter</button></section>
  <section class="card" style="display:grid;gap:8px"><span class="label">Visning</span><label class="check" style="display:flex;gap:10px;align-items:center;justify-content:flex-start"><input type="checkbox" id="mLight" ${mobLight ? "checked" : ""}> Lyst tema (for sollys)</label></section>`;
}

boot();
})();
